[package]
name = "moe-memory-search"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
moe-memory-core = { path = "../moe-memory-core" }
moe-memory-local = { path = "../moe-memory-local" }
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls"] }
serde_json = "=1.0.154"
sha2 = { version = "=0.11.0", default-features = false }
tokio = { version = "=1.53.2", default-features = false, features = ["macros", "time"] }

[dev-dependencies]
moe-agent-runtime = { path = "../moe-agent-runtime" }
tokio = { version = "=1.53.2", default-features = false, features = ["rt", "net", "io-util", "sync"] }

[lints]
workspace = true

[[example]]
name = "embedding_check"
test = true
