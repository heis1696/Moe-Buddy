[workspace]
members = ["crates/moe-memory-core", "crates/moe-memory-local", "crates/moe-agent-runtime", "crates/moe-raw-local", "crates/moe-cli-hooks", "crates/moe-memory-search", "crates/moe-ui-core", "crates/moe-chat-app", "apps/moe-buddy-desktop"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
