[package]
name = "moe-buddy-tauri"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
build = "build.rs"

[build-dependencies]
tauri-build = "=2.7.3"

[dependencies]
getrandom = "=0.4.3"
moe-agent-runtime = { path = "../../../crates/moe-agent-runtime" }
moe-chat-app = { path = "../../../crates/moe-chat-app" }
moe-desktop-adapters = { path = "../../../crates/moe-desktop-adapters" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
tauri = { version = "=2.12.4", features = ["tray-icon"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse"] }

[lints.rust]
unsafe_code = "allow"

[lints.clippy]
all = "warn"
