[package]
name = "moe-buddy-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
getrandom = "=0.4.3"
moe-agent-runtime = { path = "../../crates/moe-agent-runtime" }
moe-desktop-adapters = { path = "../../crates/moe-desktop-adapters" }
moe-chat-app = { path = "../../crates/moe-chat-app" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_Ime",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[lints.rust]
unsafe_code = "allow"

[lints.clippy]
all = "warn"
