[package]
name = "moe-buddy-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
getrandom = "=0.4.3"
moe-chat-app = { path = "../../crates/moe-chat-app" }
moe-memory-core = { path = "../../crates/moe-memory-core" }
moe-memory-local = { path = "../../crates/moe-memory-local" }
moe-raw-local = { path = "../../crates/moe-raw-local" }
moe-agent-runtime = { path = "../../crates/moe-agent-runtime" }
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls"] }
serde_json = "=1.0.154"
tokio = { version = "=1.53.2", default-features = false, features = ["rt", "net", "time"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_Ime",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[lints.rust]
unsafe_code = "allow"

[lints.clippy]
all = "warn"
